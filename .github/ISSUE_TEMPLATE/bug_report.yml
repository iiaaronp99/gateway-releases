name: Bug report
description: Gateway did something wrong on your computer.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Use this for Gateway. Odyssey Journal problems go to the Odyssey Journal link on the new-issue page, not here.

        Do not paste API keys, passwords, or your .env file. If an error shows a key, delete that part before you post.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you clicked
      description: The steps, starting from a screen you can name.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Gateway version
      description: The version from the download page or the app, such as 0.1.1. Type "not sure" if you do not know.
      placeholder: "0.1.1"
    validations:
      required: true
  - type: dropdown
    id: docker
    attributes:
      label: Was Docker Desktop running?
      options:
        - "Yes, it said it was running"
        - "No"
        - "I am not sure"
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error text
      description: Paste the message if you have one. Remove any keys first.
    validations:
      required: false
